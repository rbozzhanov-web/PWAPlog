# Cloudflare Pages project for the Pilot Logbook PWA.
#
# The site is static: `npm run build` emits apps/web/dist, and that directory is what Pages
# serves. Deploy it either by connecting this repository in the Cloudflare dashboard (build
# command `npm run build`, output directory `apps/web/dist`) or directly with
# `npm run deploy:cloudflare`, which needs CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
#
# Leave PUBLIC_BASE_PATH unset for Pages: the app is served from the domain root here, unlike
# the GitHub Pages deploy, which serves it from /PWAPlog/.
name = "pilot-logbook"
compatibility_date = "2026-09-15"
pages_build_output_dir = "apps/web/dist"
