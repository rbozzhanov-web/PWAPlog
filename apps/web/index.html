<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#eaf2fa" />
    <meta name="color-scheme" content="light dark" />
    <style>html{background:#eaf2fa;color-scheme:light}html.theme-dark{background:#091422;color-scheme:dark}body{background:inherit}</style>
    <script>
      // Apply the saved/system theme before CSS and React paint the first frame.
      (function () {
        var preference = 'system';
        try { preference = localStorage.getItem('escrew.theme-preference.v1') || 'system'; } catch (error) {}
        var dark = preference === 'dark' || (preference !== 'light' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('theme-dark', Boolean(dark));
        document.querySelector('meta[name="theme-color"]').setAttribute('content', dark ? '#091422' : '#eaf2fa');
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="eScrew" />
    <title>Pilot Logbook</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
