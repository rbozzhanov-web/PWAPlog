name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A deploy that ships a red suite is the failure mode this workflow had: it went straight
      # from install to build, so nothing ever ran the tests on the way to production.
      - run: npm run test
      - run: npm run build
        env:
          # GitHub Pages serves this repository from a subpath, unlike Cloudflare Pages.
          PUBLIC_BASE_PATH: /PWAPlog/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
